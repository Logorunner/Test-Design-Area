<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGOrunner/</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0c10;color:#7d838e;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
  header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:28px 8%;pointer-events:none}
  .logo{pointer-events:auto;cursor:pointer;display:flex;align-items:center}.logo svg{height:24px;width:auto;display:block}
  nav{display:flex;align-items:center;pointer-events:auto}
  nav a{color:#787f8c;text-decoration:none;font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.26em;transition:color .22s}
  nav a+a{margin-left:52px}nav a:hover{color:#dce5f2}
  .brg{display:none;pointer-events:auto;background:none;border:0;padding:2px;cursor:pointer;width:44px;height:44px;align-items:center;justify-content:center;opacity:0;transform:translateY(-14px);transition:opacity .45s,transform .5s cubic-bezier(.22,1,.36,1)}
  .brg.in{opacity:1;transform:translateY(0)}
  .brg svg{width:40px;height:40px;overflow:visible}
  .brg .ring{stroke-dasharray:126;stroke-dashoffset:126;transition:stroke-dashoffset .55s cubic-bezier(.22,1,.36,1),stroke .3s}
  .brg.ringOn .ring{stroke-dashoffset:0}
  .brg rect,.brg path,.brg circle{transition:transform .44s cubic-bezier(.22,1,.36,1),opacity .32s,x .44s cubic-bezier(.22,1,.36,1),y .44s cubic-bezier(.22,1,.36,1),width .44s,height .44s,rx .44s,ry .44s}
  .brg .bL{transform-origin:13px 22px}.brg .bR{transform-origin:22px 22px}.brg .bO{transform-origin:31px 16px}
  .brg .d1,.brg .d2,.brg .d3,.brg .p1,.brg .p2,.brg .p3{opacity:0;transform:scale(.6)}
  .brg .d1{transform-origin:13.2px 15.2px}.brg .d2{transform-origin:13.2px 22px}.brg .d3{transform-origin:13.2px 28.8px}
  .brg .p1{transform-origin:24.8px 15.2px}.brg .p2{transform-origin:24.8px 22px}.brg .p3{transform-origin:24.8px 28.8px}
  .brg.ready .bL{transform:translate(11.8px,-6.8px) rotate(90deg);opacity:0}
  .brg.ready .bR{transform:translate(2.8px,0px) rotate(90deg);opacity:0}
  .brg.ready .bO{transform:translate(-6.2px,12.8px) rotate(90deg);opacity:0}
  .brg.ready .d1,.brg.ready .d2,.brg.ready .d3,.brg.ready .p1,.brg.ready .p2,.brg.ready .p3{opacity:1;transform:scale(1)}
  .brg.open .d1,.brg.open .d2,.brg.open .d3,.brg.open .p2{opacity:0;transform:scale(.2)}
  .brg.open .p1{x:12px;y:19.75px;width:20px;height:4.5px;rx:2.25px;ry:2.25px;transform-origin:22px 22px;transform:rotate(45deg)}
  .brg.open .p3{x:12px;y:19.75px;width:20px;height:4.5px;rx:2.25px;ry:2.25px;transform-origin:22px 22px;transform:rotate(-45deg)}
  .mNav{position:fixed;inset:0;z-index:25;background:#0b0c10;display:flex;flex-direction:column;justify-content:center;padding:14vh 8% 10vh;clip-path:circle(0px at calc(100% - 48px) 50px);pointer-events:none;transition:clip-path .52s cubic-bezier(.76,0,.24,1)}
  .mNav.open{clip-path:circle(150vmax at calc(100% - 48px) 50px);pointer-events:auto}
  .mLinks{display:flex;flex-direction:column;align-items:flex-start;gap:.12em}
  .mNav a{font-family:'Geologica',sans-serif;font-size:clamp(2.6rem,11vw,4.2rem);font-weight:900;line-height:.94;letter-spacing:-.06em;color:#7d838e;text-decoration:none;opacity:0;filter:blur(4px);transform:translate3d(0,18px,0);transition:opacity .38s,transform .46s cubic-bezier(.22,1,.36,1),filter .38s,color .22s}
  .mNav.open a{opacity:1;filter:blur(0px);transform:translate3d(0,0,0)}
  .mNav.open a:nth-child(1){transition-delay:.28s}.mNav.open a:nth-child(2){transition-delay:.35s}.mNav.open a:nth-child(3){transition-delay:.42s}.mNav.open a:nth-child(4){transition-delay:.49s}
  .mNav a:hover,.mNav a:active{color:#00a8ff}
  .mFoot{position:absolute;left:8%;bottom:8vh;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#4f5663;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .4s}
  .mNav.open .mFoot{opacity:1;transform:translateY(0);transition-delay:.56s}
  .mFoot span{color:#00a8ff;font-weight:800}
  main{position:relative;z-index:2;height:100%;pointer-events:none}
  section{height:100%;display:flex;align-items:center;padding:12vh 8% 8vh}
  .stack{display:flex;flex-direction:column;align-items:flex-start;gap:.02em;will-change:transform}
  .t{font-family:'Geologica',sans-serif;font-size:clamp(2.5rem,7.6vw,6.8rem);font-weight:900;line-height:.84;letter-spacing:-.07em;display:inline-block;pointer-events:auto;cursor:pointer;color:#7d838e;opacity:0;filter:blur(4px);transform:translate3d(0,-14px,0);transition:color .32s,filter .36s,opacity .5s,transform .55s cubic-bezier(.22,1,.36,1);will-change:transform,filter,opacity;text-shadow:0 4px 28px rgba(11,12,16,.75)}
  .t.in{opacity:1;filter:blur(0px);transform:translate3d(0,0,0)}
  .stack.ready .t{transition:color .32s,filter .36s}
  .stack.ready .t.holding,.stack.ready .t.active{color:#00a8ff!important;filter:blur(0px)!important}
  @media(max-width:900px){nav a+a{margin-left:26px}}@media(max-width:680px){nav{display:none}.brg{display:flex}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo" aria-label="LOGOrunner/"><svg viewBox="0 0 340 44" fill="none"><text x="0" y="34" fill="#d9e5f7" font-family="'Plus Jakarta Sans',sans-serif" font-size="36" letter-spacing="-1.5"><tspan font-weight="800">LOGO</tspan><tspan font-weight="400">runner</tspan></text><polygon points="325,3 335,3 317,41 307,41" fill="#00a8ff"/></svg></div>
  <nav><a href="#work">WORK</a><a href="#services">SERVICES</a><a href="#about">ABOUT</a><a href="#contact">CONTACT</a></nav>
  <button class="brg" id="brg" aria-label="Menu">
    <svg viewBox="0 0 44 44" fill="none">
      <circle class="ring" cx="22" cy="22" r="20" stroke="#00a8ff" stroke-width="1.6" transform="rotate(-90 22 22)"/>
      <rect class="bL" x="10.5" y="11.5" width="4.8" height="21" fill="#00a8ff"/>
      <path class="bR" d="M18.2 20.5C18.2 16.9 20.7 14.5 23 14.5V32.5H18.2V20.5Z" fill="#f4f8ff"/>
      <circle class="bO" cx="30.2" cy="17.8" r="3.4" fill="#f4f8ff"/>
      <circle class="d1" cx="13.2" cy="15.2" r="2.35" fill="#00a8ff"/>
      <circle class="d2" cx="13.2" cy="22" r="2.35" fill="#f4f8ff"/>
      <circle class="d3" cx="13.2" cy="28.8" r="2.35" fill="#f4f8ff"/>
      <rect class="p1" x="17.4" y="12.85" width="15.2" height="4.7" rx="2.35" ry="2.35" fill="#00a8ff"/>
      <rect class="p2" x="17.4" y="19.65" width="15.2" height="4.7" rx="2.35" ry="2.35" fill="#f4f8ff"/>
      <rect class="p3" x="17.4" y="26.45" width="15.2" height="4.7" rx="2.35" ry="2.35" fill="#f4f8ff"/>
    </svg>
  </button>
</header>
<div class="mNav" id="mNav">
  <div class="mLinks">
    <a href="#work">WORK</a><a href="#services">SERVICES</a><a href="#about">ABOUT</a><a href="#contact">CONTACT</a>
  </div>
  <div class="mFoot">Fluent client<span>/</span></div>
</div>
<canvas id="c"></canvas>
<main><section><div class="stack" id="stk">
  <div class="t" id="wDes">DESIGN</div><div class="t" id="wId">IDENTITY</div><div class="t" id="wIll">ILLUSTRATION</div><div class="t">FILM</div><div class="t" id="wWeb">WEB</div>
</div></section></main>
<script>
(function(){
  var c=document.getElementById("c"),ctx=c.getContext("2d"),w=c.width=innerWidth,h=c.height=innerHeight,stk=document.getElementById("stk"),logo=document.getElementById("logo");
  var lCv=document.createElement("canvas"),lCtx=lCv.getContext("2d");lCv.width=w;lCv.height=h;
  var brg=document.getElementById("brg"),mNav=document.getElementById("mNav");
  var COLS=92,ROWS=56,N=COLS*ROWS,R0=.95,t=0,scrollY=0,maxScroll=160,touchY=0,hovRow=-1,isHolding=0,ready=0;
  var illMode=0,illHold=0,illRev=0,illProg=0,illSkipClick=0,lensAmt=0,pxN=0,pyN=0;
  var m={x:-999,y:-999,lx:innerWidth*.65,ly:innerHeight*.5,on:0},dots=[],els=document.querySelectorAll(".t"),wDes=document.getElementById("wDes"),wIll=document.getElementById("wIll");
  var rowX=[],STEP_BLUR=[0,.85,1.45,2.0,2.5],STEP_COL=["#dce5f2","#676e7a","#545a65","#444953","#383d46"];

  var mythImg=new Image(),imgReady=0;
  mythImg.onload=function(){imgReady=1;sampleImage()};
  mythImg.src="myth-reality.png";

  function coverBox(iw,ih,sc){
    var s=sc||1,ir=iw/ih,vr=w/h,bw,bh;
    if(vr>ir){bw=w*s;bh=(w/ir)*s}else{bh=h*s;bw=(h*ir)*s}
    return{x:(w-bw)*.5,y:(h-bh)*.5,w:bw,h:bh};
  }

  function sampleImage(){
    if(!imgReady)return;
    try{
      var sc=document.createElement("canvas");sc.width=COLS;sc.height=ROWS;
      var sx=sc.getContext("2d"),b=coverBox(mythImg.width,mythImg.height,1);
      sx.drawImage(mythImg,(b.x/w)*COLS,(b.y/h)*ROWS,(b.w/w)*COLS,(b.h/h)*ROWS);
      var d=sx.getImageData(0,0,COLS,ROWS).data;
      for(var i=0;i<N;i++){
        var r=d[i*4],g=d[i*4+1],b2=d[i*4+2];
        dots[i].lum=(r*.3+g*.59+b2*.11)/255;
      }
    }catch(e){}
  }

  function fallbackLum(u,v){
    var d1=Math.hypot(u-.15,v-.22)<.21,d2=Math.hypot(u-.76,v-.32)<.16,d3=Math.hypot(u-.09,v-.79)<.2,d4=Math.hypot(u-.36,v-.82)<.17,d5=Math.hypot(u-.88,v-.72)<.24;
    if(Math.hypot(u-.54,v-.11)<.025||d3||d5)return .82;
    if(d4)return .66;
    if(Math.hypot(u-.76,v-.86)<.035||d1||d2)return .52;
    return .18;
  }

  setTimeout(function(){brg.classList.add("in")},120);
  setTimeout(function(){brg.classList.add("ringOn")},520);
  setTimeout(function(){brg.classList.add("ready")},1050);
  function closeMenu(){brg.classList.remove("open");mNav.classList.remove("open")}
  brg.addEventListener("click",function(e){e.stopPropagation();if(!brg.classList.contains("ready"))return;brg.classList.toggle("open");mNav.classList.toggle("open")});
  mNav.querySelectorAll("a").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();closeMenu()})});

  function updateFocus(){
    if(!ready)return;
    for(var i=0;i<els.length;i++){
      if(isHolding||illMode||hovRow<0){els[i].style.color="";els[i].style.filter="blur(0px)"}
      else{var dist=Math.min(4,Math.abs(i-hovRow));els[i].style.color=STEP_COL[dist];els[i].style.filter="blur("+STEP_BLUR[dist]+"px)"}
    }
  }
  function clearHold(){isHolding=0;for(var i=0;i<els.length;i++)els[i].classList.remove("holding");updateFocus()}
  for(var row=0;row<els.length;row++){
    rowX[row]=0;
    (function(wEl,rIdx){
      wEl.addEventListener("mouseenter",function(){hovRow=rIdx;updateFocus()});
      wEl.addEventListener("mouseleave",function(){if(hovRow===rIdx){hovRow=-1;updateFocus()}});
      setTimeout(function(){wEl.classList.add("in")},60+rIdx*65);
    })(els[row],row);
  }
  stk.addEventListener("mouseleave",function(){hovRow=-1;updateFocus()});
  setTimeout(function(){ready=1;stk.classList.add("ready");updateFocus();calcMax()},680);

  function calcMax(){
    stk.style.transform="translate3d(0,0,0)";
    var lr=logo.getBoundingClientRect();
    maxScroll=Math.max(80,wDes.getBoundingClientRect().top-(lr.top+lr.height*.45));
    if(scrollY>maxScroll)scrollY=maxScroll;
    stk.style.transform="translate3d(0,"+(-scrollY).toFixed(1)+"px,0)";
  }

  var glyphs=[
    {t:0,u:.538,v:.11,s:17,f:1,c:"#d4cc1e",dp:1.15},
    {t:0,u:.758,v:.855,s:23,f:1,c:"#0094d8",dp:1.25},
    {t:1,u:.224,v:.692,s:11,f:1,c:"#e2d824",dp:1.1},
    {t:1,u:.922,v:.155,s:9,f:1,c:"#e2d824",dp:1.3},
    {t:1,u:.276,v:.375,s:5,f:1,c:"#0b0c10",dp:.95},
    {t:1,u:.758,v:.495,s:5,f:1,c:"#f4f8ff",dp:1.2},
    {t:2,u:.446,v:.088,s:5,f:0,c:"#e2d824",dp:1.05},
    {t:2,u:.573,v:.242,s:5,f:0,c:"#00a8ff",dp:1.18},
    {t:2,u:.18,v:.925,s:6,f:0,c:"#5eb6e4",dp:1.12},
    {t:2,u:.748,v:.715,s:5,f:0,c:"#e2d824",dp:1.22},
    {t:2,u:.066,v:.545,s:4,f:0,c:"#f4f8ff",dp:1.08}
  ];

  for(var k=0;k<N;k++){
    var c0=k%COLS,r0=(k/COLS)|0,u=(c0+.5)/COLS,v=(r0+.5)/ROWS;
    dots.push({x:0,y:0,rx:0,ry:0,c:c0,r:r0,u:u,v:v,lum:fallbackLum(u,v)});
  }
  calcMax();if(document.fonts)document.fonts.ready.then(calcMax);
  function downIll(e){e.stopPropagation();if(illMode){illHold=1;illSkipClick=0;isHolding=1;wIll.classList.add("holding");updateFocus()}}
  function clickIll(e){
    e.stopPropagation();clearHold();if(illSkipClick){illSkipClick=0;return}
    illMode=illMode?0:1;illHold=0;illRev=0;if(illMode)illProg=0;
    if(illMode)wIll.classList.add("active");else wIll.classList.remove("active");
    updateFocus();
  }
  function endPress(){clearHold();if(illHold){illHold=0;if(illRev>.14)illSkipClick=1}}
  wIll.addEventListener("mousedown",downIll);wIll.addEventListener("touchstart",function(e){if(illMode)downIll(e)},{passive:true});
  wIll.addEventListener("click",clickIll);
  window.addEventListener("mouseup",endPress);window.addEventListener("touchend",endPress);
  logo.addEventListener("click",function(){closeMenu();if(illMode){illMode=0;wIll.classList.remove("active");updateFocus()}});

  function applyScroll(dy){
    if(mNav.classList.contains("open"))return;
    scrollY=Math.max(0,Math.min(maxScroll,scrollY+dy*.71));
    stk.style.transform="translate3d(0,"+(-scrollY).toFixed(1)+"px,0)";
  }
  document.querySelectorAll("nav a").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault()})});
  window.addEventListener("resize",function(){w=c.width=lCv.width=innerWidth;h=c.height=lCv.height=innerHeight;if(w>680)closeMenu();calcMax();sampleImage()});
  window.addEventListener("mousemove",function(e){m.x=e.clientX;m.y=e.clientY;m.on=1});
  window.addEventListener("mouseleave",function(){m.on=0;hovRow=-1;clearHold()});
  window.addEventListener("selectstart",function(e){e.preventDefault()});
  window.addEventListener("wheel",function(e){e.preventDefault();applyScroll(e.deltaY)},{passive:false});
  window.addEventListener("touchstart",function(e){if(e.touches.length){touchY=e.touches.clientY;m.x=e.touches.clientX;m.y=e.touches.clientY;m.on=1}},{passive:true});
  window.addEventListener("touchmove",function(e){if(!e.touches.length)return;e.preventDefault();var ny=e.touches.clientY;m.x=e.touches.clientX;m.y=ny;m.on=1;applyScroll((touchY-ny)*1.15);touchY=ny},{passive:false});

  function loop(){
    ctx.fillStyle="#0b0c10";ctx.fillRect(0,0,w,h);t+=.04;
    if(ready)for(var r=0;r<5;r++){
      var tx=((isHolding||illMode)&&hovRow===r)?4:(hovRow===r?10:0);
      rowX[r]+=(tx-rowX[r])*.18;if(Math.abs(tx-rowX[r])<.03)rowX[r]=tx;
      els[r].style.transform="translate3d("+rowX[r].toFixed(1)+"px,0,0)";
    }
    if(illMode)illProg=Math.min(1,illProg+.026);else illProg=Math.max(0,illProg-.05);
    illRev+=((illHold?1:0)-illRev)*.065;
    if(m.on){m.lx+=(m.x-m.lx)*.18;m.ly+=(m.y-m.ly)*.18}
    var lensTarget=(illMode&&m.on&&illProg>.45)?1:0;
    lensAmt+=(lensTarget-lensAmt)*.12;

    var tPx=illMode?(m.on?((m.x/w)-.5)*2:Math.sin(t*.35)*.35):0;
    var tPy=illMode?(m.on?((m.y/h)-.5)*2:Math.cos(t*.28)*.25):0;
    pxN+=(tPx-pxN)*.08;pyN+=(tPy-pyN)*.08;
    var bgOx=-pxN*14*illProg,bgOy=-pyN*10*illProg;
    var fgOx=-pxN*46*illProg,fgOy=-pyN*34*illProg;

    var bgPy=-scrollY*.28,fieldR=Math.min(w,h)*.15,fadeOut=Math.max(0,1-illRev*1.25);
    var box=imgReady?coverBox(mythImg.width,mythImg.height,1.035):{x:-w*.018,y:-h*.018,w:w*1.036,h:h*1.036};
    var baseR=Math.min(w,h)*.3*lensAmt,maxR=Math.hypot(Math.max(m.lx,w-m.lx),Math.max(m.ly,h-m.ly))+60;
    var waveE=illRev*illRev*(3-2*illRev),lensR=illMode?(baseR+(maxR-baseR)*waveE):0;
    var band=Math.min(w,h)*.07+illRev*45;

    if(illProg>.01&&imgReady&&lensR>2){
      if(waveE>.985){
        ctx.save();ctx.globalAlpha=Math.min(1,illRev*1.25);
        ctx.drawImage(mythImg,box.x+bgOx,box.y+bgOy,box.w,box.h);ctx.restore();
      }else{
        lCtx.globalCompositeOperation="source-over";lCtx.clearRect(0,0,w,h);
        lCtx.drawImage(mythImg,box.x+bgOx,box.y+bgOy,box.w,box.h);
        lCtx.globalCompositeOperation="destination-in";
        var grd=lCtx.createRadialGradient(m.lx,m.ly,lensR*.78,m.lx,m.ly,lensR);
        grd.addColorStop(0,"rgba(0,0,0,1)");grd.addColorStop(1,"rgba(0,0,0,0)");
        lCtx.fillStyle=grd;lCtx.fillRect(0,0,w,h);
        ctx.save();ctx.globalAlpha=Math.min(1,Math.max(lensAmt,illRev*1.25));
        ctx.drawImage(lCv,0,0);ctx.restore();
      }
    }

    for(var i=0;i<N;i++){
      var d=dots[i],gx=d.u*w,gy=d.v*h+(illMode?0:bgPy);
      var midOx=illMode?(-pxN*22*illProg):0,midOy=illMode?(-pyN*16*illProg):0;
      var bx=gx+midOx,by=gy+midOy,trx=0,try_=0,inLens=0,rimBoost=0;
      if(illMode&&lensR>2){
        var ldx=bx-m.lx,ldy=by-m.ly,ld=Math.hypot(ldx,ldy);
        if(ld<lensR+band){
          var norm=ld/lensR;
          if(norm<1)inLens=norm<.78?1:Math.pow((1-norm)/.22,1.4);
          var rim=Math.exp(-Math.pow((ld-lensR*.92)/(band*.5),2));
          rimBoost=rim;
          if(ld>.5){var push=(9+illRev*13)*rim;trx=(ldx/ld)*push;try_=(ldy/ld)*push}
        }
      }else if(m.on&&!illMode){
        var fdx=gx-m.x,fdy=gy-m.y,fd=Math.hypot(fdx,fdy);
        if(fd>1&&fd<fieldR){var push2=Math.pow(1-fd/fieldR,1.6)*15;trx=(fdx/fd)*push2;try_=(fdy/fd)*push2}
      }
      d.rx+=(trx-d.rx)*.16;d.ry+=(try_-d.ry)*.16;
      d.x=bx+d.rx;d.y=by+d.ry;

      if(illMode&&inLens>.96&&waveE>.92)continue;
      var r=88,g=132,b=198,al=.42,rad=R0;
      if(illMode){
        var mFade=Math.max(0,Math.min(1,(illProg-.08)/.42));
        var ct=Math.max(0,Math.min(1,(d.lum-.22)/.68));
        r=Math.round(88-88*mFade);
        g=Math.round(132+36*mFade);
        b=Math.round(198+57*mFade);
        al=(.42+(1-.42)*mFade)*fadeOut*(1-inLens);
        rad=(R0+((ct*2.65)-R0)*mFade)*(1-inLens*.65)+rimBoost*(.85+illRev*.7)*mFade;
      }else if(m.on){
        var dm=Math.hypot(d.x-m.x,d.y-m.y),infR=Math.min(w,h)*.22,inf=dm<infR?Math.pow(1-dm/infR,1.5):0;
        r=Math.round(88-26*inf);g=Math.round(132+38*inf);b=Math.round(198+57*inf);al=.42+.56*inf;rad=R0+inf*.45;
      }
      if(rad<.18||al<=.005)continue;
      ctx.beginPath();ctx.arc(d.x,d.y,rad,0,6.2832);ctx.fillStyle="rgba("+r+","+g+","+b+","+al+")";ctx.fill();
    }

    if(illProg>.01&&fadeOut>.005){
      var gFade=Math.min(1,illProg*2.4);
      for(var gi=0;gi<glyphs.length;gi++){
        var gl=glyphs[gi],st=Math.max(0,Math.min(1,(gFade-gi*.045)/.42));if(st<=0)continue;
        var gx2=box.x+gl.u*box.w+fgOx*gl.dp,gy2=box.y+gl.v*box.h+fgOy*gl.dp+Math.sin(t*.7+gi)*2;

        var gs=gl.s*(.35+.65*st)*(1+gRim*.28),gAl=st*fadeOut*(1-gIn);

        ctx.save();ctx.translate(gx2,gy2);ctx.globalAlpha=gAl;
        if(gl.f){ctx.fillStyle=gl.c}else{ctx.strokeStyle=gl.c;ctx.lineWidth=1.8}
        ctx.beginPath();
        if(gl.t===0){ctx.arc(0,0,gs,0,6.2832)}
        else if(gl.t===1){ctx.moveTo(0,-gs);ctx.lineTo(gs*.92,gs*.75);ctx.lineTo(-gs*.92,gs*.75);ctx.closePath()}
        else{ctx.moveTo(-gs,0);ctx.lineTo(gs,0);ctx.moveTo(0,-gs);ctx.lineTo(0,gs)}
        if(gl.f)ctx.fill();else ctx.stroke();
        ctx.restore();
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
